[project]
name = "temas"
version = "2.1.0"
description = "Turkey Earthquake Monitoring and Analysis System"
authors = [{ name = "marcuz-apl", email = "marcus.zou@icloud.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.6.0",
    "python-dateutil>=2.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

